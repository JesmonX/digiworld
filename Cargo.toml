[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "plugins/keyboard-heatmap/backend",
  "plugins/agent-token-heatmap/backend",
  "plugins/mail-assistant/backend",
  "plugins/github-actions/backend",
  "plugins/server-monitor/backend",
  "plugins/calendar-todo/backend",
]

[workspace.package]
version = "0.2.32"
edition = "2024"
license = "MIT"
repository = "https://github.com/JesmonX/digiworld"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "process", "sync", "time", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
