name: Windows Preview and Alpha releases (no Authenticode)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without v prefix
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  pages: write

concurrency:
  group: windows-release-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    runs-on: windows-latest
    environment: production-release
    env:
      DIGIWORLD_PLUGIN_SIGNING_KEY_B64: ${{ secrets.DIGIWORLD_PLUGIN_SIGNING_KEY_B64 }}
      DIGIWORLD_PLUGIN_PUBLIC_KEY_B64: ${{ vars.DIGIWORLD_PLUGIN_PUBLIC_KEY_B64 }}
      DIGIWORLD_UPDATER_PUBLIC_KEY: ${{ vars.DIGIWORLD_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve release metadata
        id: release
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $version = $env:REQUESTED_VERSION
            $name = "Digiworld v$version Preview"
            $prerelease = 'false'
            $makeLatest = 'true'
          } else {
            $baseVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
            if ($baseVersion -notmatch '^\d+\.\d+\.\d+$') {
              throw "Automatic Alpha releases require a stable package.json version, got: $baseVersion"
            }
            $version = "$baseVersion-alpha.$($env:RUN_NUMBER)"
            $name = "Digiworld v$version Alpha"
            $prerelease = 'true'
            $makeLatest = 'false'
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Invalid release version: $version"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prerelease=$prerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "make_latest=$makeLatest" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "DIGIWORLD_RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Refuse an unsigned release
        shell: pwsh
        run: |
          if (-not $env:DIGIWORLD_PLUGIN_SIGNING_KEY_B64) { throw 'Missing plugin signing key' }
          if (-not $env:DIGIWORLD_PLUGIN_PUBLIC_KEY_B64) { throw 'Missing plugin public key' }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Missing Tauri updater signing key' }
          if (-not $env:DIGIWORLD_UPDATER_PUBLIC_KEY) { throw 'Missing Tauri updater public key' }
      - name: Confirm preview signing keys
        shell: pwsh
        run: Write-Host 'Plugin archives and updater bundles are cryptographically signed; Windows Authenticode is intentionally omitted for this preview.'
      - name: Validate plugin signing key format
        run: node scripts/validate-plugin-signing-key.mjs
      - name: Configure release metadata
        run: node scripts/configure-release.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: cargo test --workspace
      - run: pnpm --filter @digiworld/plugin-keyboard-heatmap-ui build
      - run: cargo build --release -p digiworld-keyboard-heatmap
      - run: pnpm --filter @digiworld/plugin-agent-token-heatmap-ui build
      - run: cargo build --release -p digiworld-agent-token-heatmap
      - name: Package signed keyboard plugin
        shell: pwsh
        env:
          DIGIWORLD_TARGET: windows-x86_64
          DIGIWORLD_RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: pnpm package:keyboard
      - name: Package signed Agent Token plugin
        shell: pwsh
        env:
          DIGIWORLD_TARGET: windows-x86_64
          DIGIWORLD_RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: pnpm package:agent-tokens
      - name: Build signed plugin catalog
        env:
          DIGIWORLD_CATALOG_SEQUENCE: ${{ github.run_number }}
        run: pnpm catalog:build
      - name: Build Digiworld installer and updater artifact
        run: pnpm --filter @digiworld/desktop tauri build
      - name: Build updater manifest
        run: node scripts/build-update-manifest.mjs
      - name: Stage updater manifest for GitHub Pages
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path updates | Out-Null
          Copy-Item target/release/bundle/nsis/latest.json updates/latest.json
      - name: Generate checksums and preview notice
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem dist/plugins/*.dwpkg
            Get-ChildItem dist/plugins/*.dwpkg.sig
            Get-ChildItem target/release/bundle/nsis/*.exe
            Get-ChildItem target/release/bundle/nsis/*.sig
            Get-ChildItem target/release/bundle/nsis/latest.json
          ) | Sort-Object FullName
          $root = (Get-Location).Path + '\'
          $lines = $files | ForEach-Object {
            $relative = $_.FullName.Replace($root, '').Replace('\', '/')
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $relative"
          }
          Set-Content -Path SHA256SUMS.txt -Value $lines -Encoding utf8
          Set-Content -Path PREVIEW-UNSIGNED.txt -Value @(
            'Digiworld Preview: Windows Authenticode is not included in this zero-cost build.'
            'The plugin archive and updater bundle are still cryptographically signed.'
            'Windows SmartScreen may show an unknown-publisher warning.'
          ) -Encoding utf8
      - uses: actions/upload-artifact@v7
        with:
          name: windows-preview-release
          path: |
            dist/plugins/*
            catalog/v1/*
            target/release/bundle/nsis/*
            SHA256SUMS.txt
            PREVIEW-UNSIGNED.txt
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          name: release-update-site
          path: |
            catalog
            updates
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.name }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          make_latest: ${{ steps.release.outputs.make_latest }}
          generate_release_notes: true
          files: |
            dist/plugins/*
            target/release/bundle/nsis/*
            SHA256SUMS.txt
            PREVIEW-UNSIGNED.txt

  deploy-catalog:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-update-site
          path: site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
