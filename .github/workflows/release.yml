name: Windows and macOS Preview releases

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pages: write

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      name: ${{ steps.release.outputs.name }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      make_latest: ${{ steps.release.outputs.make_latest }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@24
          cache: false
          install: false
      - name: Resolve next Preview version
        id: release
        run: node scripts/resolve-preview-version.mjs

  build-windows:
    needs: prepare
    runs-on: windows-latest
    environment: production-release
    env:
      DIGIWORLD_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      DIGIWORLD_PLUGIN_SIGNING_KEY_B64: ${{ secrets.DIGIWORLD_PLUGIN_SIGNING_KEY_B64 }}
      DIGIWORLD_PLUGIN_PUBLIC_KEY_B64: ${{ vars.DIGIWORLD_PLUGIN_PUBLIC_KEY_B64 }}
      DIGIWORLD_UPDATER_PUBLIC_KEY: ${{ vars.DIGIWORLD_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@24
          cache: true
          install: false
      - name: Refuse an unsigned release
        shell: pwsh
        run: |
          if (-not $env:DIGIWORLD_PLUGIN_SIGNING_KEY_B64) { throw 'Missing plugin signing key' }
          if (-not $env:DIGIWORLD_PLUGIN_PUBLIC_KEY_B64) { throw 'Missing plugin public key' }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Missing Tauri updater signing key' }
          if (-not $env:DIGIWORLD_UPDATER_PUBLIC_KEY) { throw 'Missing Tauri updater public key' }
      - name: Confirm Preview signing policy
        shell: pwsh
        run: Write-Host 'Plugin archives and updater bundles are cryptographically signed; Windows Authenticode is intentionally omitted.'
      - name: Validate plugin signing key format
        run: node scripts/validate-plugin-signing-key.mjs
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Configure release metadata
        run: node scripts/configure-release.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Build plugin frontends
        run: pnpm --filter "@digiworld/plugin-*-ui" build
      - run: pnpm check:ui
      - run: pnpm exec playwright install chromium
      - name: Validate built plugin interfaces
        run: pnpm test:ui
      - name: Build plugin backends
        run: cargo build --release -p digiworld-keyboard-heatmap -p digiworld-agent-token-heatmap -p digiworld-mail-assistant -p digiworld-github-actions -p digiworld-server-monitor -p digiworld-calendar-todo -p digiworld-markpad
      - name: Package signed plugins
        shell: pwsh
        env:
          DIGIWORLD_TARGET: windows-x86_64
          DIGIWORLD_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          pnpm package:keyboard
          pnpm package:agent-tokens
          pnpm package:mail
          pnpm package:github-actions
          pnpm package:server-monitor
          pnpm package:calendar-todo
          pnpm package:markpad
      - name: Build Digiworld installer and updater artifact
        run: pnpm --filter @digiworld/desktop tauri build
      - name: Stage Windows release
        shell: pwsh
        run: |
          $stage = 'dist/release/windows-x86_64'
          New-Item -ItemType Directory -Force -Path "$stage/plugins", "$stage/app" | Out-Null
          Copy-Item dist/plugins/* "$stage/plugins/"
          Copy-Item target/release/bundle/nsis/*.exe "$stage/app/"
          Copy-Item target/release/bundle/nsis/*.sig "$stage/app/"
      - uses: actions/upload-artifact@v7
        with:
          name: platform-release-windows-x86_64
          path: dist/release/windows-x86_64
          if-no-files-found: error

  build-macos:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-aarch64
          - runner: macos-15-intel
            target: darwin-x86_64
    runs-on: ${{ matrix.runner }}
    environment: production-release
    env:
      DIGIWORLD_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      DIGIWORLD_PLUGIN_SIGNING_KEY_B64: ${{ secrets.DIGIWORLD_PLUGIN_SIGNING_KEY_B64 }}
      DIGIWORLD_PLUGIN_PUBLIC_KEY_B64: ${{ vars.DIGIWORLD_PLUGIN_PUBLIC_KEY_B64 }}
      DIGIWORLD_UPDATER_PUBLIC_KEY: ${{ vars.DIGIWORLD_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        if: matrix.target != 'darwin-x86_64'
        with:
          version: 11.21.0
          runtime: node@24
          cache: true
          install: false
      - uses: actions/setup-node@v6
        if: matrix.target == 'darwin-x86_64'
        with:
          node-version: 24
      - name: Install pnpm on Intel macOS
        if: matrix.target == 'darwin-x86_64'
        run: npm install --global pnpm@11.21.0
      - name: Refuse an unsigned release
        run: |
          test -n "$DIGIWORLD_PLUGIN_SIGNING_KEY_B64"
          test -n "$DIGIWORLD_PLUGIN_PUBLIC_KEY_B64"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$DIGIWORLD_UPDATER_PUBLIC_KEY"
      - name: Confirm Preview signing policy
        run: echo 'The app and plugin executables use ad-hoc code signing; Apple notarization is intentionally omitted.'
      - name: Validate plugin signing key format
        run: node scripts/validate-plugin-signing-key.mjs
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}
      - name: Configure release metadata
        run: node scripts/configure-release.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Build plugin frontends
        run: pnpm --filter "@digiworld/plugin-*-ui" build
      - run: pnpm check:ui
      - run: pnpm exec playwright install chromium
      - name: Validate built plugin interfaces
        run: pnpm test:ui
      - name: Build plugin backends
        run: cargo build --release -p digiworld-keyboard-heatmap -p digiworld-agent-token-heatmap -p digiworld-mail-assistant -p digiworld-github-actions -p digiworld-server-monitor -p digiworld-calendar-todo -p digiworld-markpad
      - name: Ad-hoc sign plugin backends
        run: |
          for binary in \
            target/release/digiworld-agent-token-heatmap \
            target/release/digiworld-mail-assistant \
            target/release/digiworld-github-actions \
            target/release/digiworld-server-monitor \
            target/release/digiworld-calendar-todo \
            target/release/digiworld-markpad
          do
            codesign --force --sign - "$binary"
            codesign --verify --verbose "$binary"
          done
      - name: Package signed plugins
        env:
          DIGIWORLD_TARGET: ${{ matrix.target }}
          DIGIWORLD_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          pnpm package:agent-tokens
          pnpm package:mail
          pnpm package:github-actions
          pnpm package:server-monitor
          pnpm package:calendar-todo
          pnpm package:markpad
      - name: Build Digiworld DMG and updater artifact
        run: pnpm --filter @digiworld/desktop tauri build --bundles dmg
      - name: Stage macOS release
        env:
          DIGIWORLD_TARGET: ${{ matrix.target }}
        run: |
          stage="dist/release/$DIGIWORLD_TARGET"
          mkdir -p "$stage/plugins" "$stage/app"
          cp dist/plugins/* "$stage/plugins/"
          dmgs=(target/release/bundle/dmg/*.dmg)
          updaters=(target/release/bundle/macos/*.app.tar.gz)
          test ${#dmgs[@]} -eq 1
          test ${#updaters[@]} -eq 1
          test -s "${updaters[0]}.sig"
          cp "${dmgs[0]}" "$stage/app/Digiworld_${DIGIWORLD_RELEASE_VERSION}_${DIGIWORLD_TARGET}.dmg"
          cp "${updaters[0]}" "$stage/app/Digiworld_${DIGIWORLD_RELEASE_VERSION}_${DIGIWORLD_TARGET}.app.tar.gz"
          cp "${updaters[0]}.sig" "$stage/app/Digiworld_${DIGIWORLD_RELEASE_VERSION}_${DIGIWORLD_TARGET}.app.tar.gz.sig"
      - uses: actions/upload-artifact@v7
        with:
          name: platform-release-${{ matrix.target }}
          path: dist/release/${{ matrix.target }}
          if-no-files-found: error

  publish:
    needs: [prepare, build-windows, build-macos]
    runs-on: ubuntu-latest
    environment: production-release
    env:
      DIGIWORLD_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      DIGIWORLD_PLUGIN_SIGNING_KEY_B64: ${{ secrets.DIGIWORLD_PLUGIN_SIGNING_KEY_B64 }}
      DIGIWORLD_UPDATER_PUBLIC_KEY: ${{ vars.DIGIWORLD_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@24
          cache: false
          install: false
      - name: Validate plugin signing key format
        run: node scripts/validate-plugin-signing-key.mjs
      - name: Configure reproducible release metadata
        run: node scripts/configure-release.mjs
      - uses: actions/download-artifact@v8
        with:
          name: platform-release-windows-x86_64
          path: dist/release/windows-x86_64
      - uses: actions/download-artifact@v8
        with:
          name: platform-release-darwin-aarch64
          path: dist/release/darwin-aarch64
      - uses: actions/download-artifact@v8
        with:
          name: platform-release-darwin-x86_64
          path: dist/release/darwin-x86_64
      - name: Build cross-platform plugin catalog
        env:
          DIGIWORLD_CATALOG_SEQUENCE: ${{ github.run_number }}
        run: |
          mkdir -p dist/plugins
          cp dist/release/*/plugins/* dist/plugins/
          pnpm catalog:build
      - name: Build cross-platform updater manifest
        run: |
          mkdir -p updates
          node scripts/build-update-manifest.mjs
      - name: Stage release assets and checksums
        run: |
          mkdir -p dist/release-assets
          cp dist/release/*/app/* dist/release-assets/
          cp dist/plugins/*.dwpkg dist/plugins/*.dwpkg.sig dist/release-assets/
          cp updates/latest.json dist/release-assets/latest.json
          (
            cd dist/release-assets
            sha256sum * > ../../SHA256SUMS.txt
          )
          printf '%s\n' \
            'Digiworld Preview release policy:' \
            '- Windows Authenticode is not included; SmartScreen may show an unknown publisher warning.' \
            '- macOS builds use ad-hoc code signing and are not Apple-notarized; Gatekeeper may require approval in Privacy & Security.' \
            '- Plugin archives and updater bundles are cryptographically signed.' \
            > PREVIEW-UNSIGNED.txt
          cp SHA256SUMS.txt PREVIEW-UNSIGNED.txt dist/release-assets/
      - name: Publish versioned source commit and tag
        run: |
          tag='${{ needs.prepare.outputs.tag }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock package.json apps/desktop/package.json apps/desktop/src-tauri/tauri.conf.json packages/design-system/package.json packages/plugin-sdk/package.json packages/typography/package.json
          git commit -m "chore(release): prepare $tag [skip ci]"
          git tag "$tag"
          git push origin "HEAD:${{ github.ref_name }}" "$tag"
      - uses: actions/upload-artifact@v7
        with:
          name: preview-release
          path: dist/release-assets
      - uses: actions/upload-artifact@v7
        with:
          name: release-update-site
          path: |
            catalog
            updates
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.name }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          make_latest: ${{ needs.prepare.outputs.make_latest }}
          generate_release_notes: true
          files: dist/release-assets/*

  deploy-catalog:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-update-site
          path: site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
